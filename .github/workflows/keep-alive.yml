# Keeps the AEGIS backend on Render's free plan awake.
# Render puts free web services to sleep after 15 minutes without traffic; the next request then waits
# about a minute for a cold start. Pinging the health endpoint every 10 minutes prevents that.
# (A health check does not call the AI model, so it costs nothing on the API key.)
#
# To use another backend URL, set a repository variable AEGIS_API_URL
# (GitHub → Settings → Secrets and variables → Actions → Variables).

name: Keep backend awake

on:
  schedule:
    - cron: "*/10 * * * *"     # every 10 minutes (GitHub may start scheduled runs a few minutes late)
  workflow_dispatch: {}        # also lets you run it by hand from the Actions tab

permissions: {}                # this job needs no access to the repository

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping /api/health
        env:
          API_URL: ${{ vars.AEGIS_API_URL || 'https://aegis-api-dxc3.onrender.com' }}
        run: |
          # a sleeping service can take ~60 s to wake, so allow generous timeouts and a few retries
          for attempt in 1 2 3; do
            code=$(curl -s -o /tmp/health.json -w "%{http_code}" --max-time 90 "$API_URL/api/health" || echo "000")
            echo "attempt $attempt: HTTP $code"
            if [ "$code" = "200" ]; then
              cat /tmp/health.json; echo
              exit 0
            fi
            sleep 20
          done
          echo "::warning::Backend did not answer with 200 after 3 attempts"
          exit 1
